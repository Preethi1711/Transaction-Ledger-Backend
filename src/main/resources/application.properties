# Application
spring.application.name=transaction-ledger
logging.level.com.transactionledger=INFO
server.port=${SERVER_PORT:8080}

# PostgreSQL
spring.datasource.url=${DB_URL:jdbc:postgresql://127.0.0.1:5432/ledger?sslmode=disable}
spring.datasource.username=${DB_USERNAME:ledger}
spring.datasource.password=${DB_PASSWORD:ledger}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# JSON Serialization
spring.jackson.serialization.write-dates-as-timestamps=false

# Error Handling
spring.mvc.problemdetails.enabled=false

# Swagger / OpenAPI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
